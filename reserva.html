<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
</head>
<body>
    <h1>Haga su reserva</h1>
    <form action="/procesa.php" method="get">
    <fieldset>
        <legend>Datos Personales</legend>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"
        maxlength="100" required autofocus>
        <br><br>
        <label for=apellidos>Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos"
        maxlength="100" required>
        <br><br>
        <label for="dni">DNI/NIE:</label>
        <input type="text" id="dni" name="dni"
        maxlength="10" placeholder="DNI con letra" required>
    </fieldset>
    <br>
    <fieldset>
        <legend>Datos de su estancia</legend>
        <p>Habitación:</p>
        <input type="radio" id="Doble" name="Habitación"
        value="Individual" required>
        <label for="individual">Individual</label>
        <input type="radio" id="Doble" name="Habitación"
        value="Doble">
        <label for="doble">Doble</label>
        <input type="radio" id="triple" name="Habitación"
        value="Triple">
        <label for="cuadruple">Cuadruple</label>
        <input type="radio" id="cuadruple" name="Habitación"
        value="Cuadruple">
       <label for="cuadruple">Cuadruple</label>
        <br><br>
        <label for="personas">Numero de personas:</label>
        <select id="personas" name="personas">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
        </select>
        <br><br>
        <label for="mascotas">Llevo Mascotas</label>
        <input type="checkbox" id="mascotas" name="Mascotas" 
         value="Si">
         <br><br>
            Fecha de llegada:<input type="date" name="Fecha_lleg">
        <br><br>
            Hora de llegada:<input type="time" name="hora_legg">
    </fieldset>
    <br>
    <input type="submit" value="Enviar">Envia los datos
    <input type="reset" value="Reiniciar">Reseta el formulario
    <br><br>
    <a href="index.html">Volver</a>
</body>
</html>
